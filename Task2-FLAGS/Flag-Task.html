<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Countries Flags</title>

    <link rel="stylesheet" href="Flag-Task.css" />
  </head>

  <body>
    <h1>Countries Flags</h1>
    <div class="population-filter">
      <label> Minimum Population </label>

      <input type="number" id="minPopulation" />

      <label> Maximum Population </label>

      <input type="number" id="maxPopulation" />

      <button id="applyPopulationFilter">Apply Filter</button>

      <button id="resetPopulationFilter">Reset</button>

      <p id="populationError"></p>
    </div>
    <div
      style="display: flex; justify-content: space-between; align-items: center"
    >
      <div class="favorite-filter">
        <input type="checkbox" id="showFavorites" />

        <label for="showFavorites"> Show Favorites Only </label>
      </div>
      <div class="countries-page">
        <label> Countries per page: </label>

        <select id="countriesPerPage">
          <option value="5" selected>5</option>

          <option value="10">10</option>

          <option value="20">20</option>

          <option value="50">50</option>
        </select>
      </div>
      <div class="random-country">
        <button id="randomCountryBtn">🎲 Random Country</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Country Flag</th>

          <th>Country Name</th>

          <th>Population</th>

          <th>Favorite</th>
        </tr>
      </thead>
      <div id="statusMessage"></div>
      <tbody id="countryTable"></tbody>
    </table>

    <div class="pagination">
      <button id="prev">Prev</button>

      <span id="pageNumber"> 1 </span>

      <button id="next">Next</button>
    </div>
    <div id="countryModal" class="modal">
      <div class="modal-card">
        <h2>Country Details</h2>

        <img id="modalFlag" width="100" />

        <p><b>Name:</b> <span id="modalName"></span></p>

        <p><b>Capital:</b> <span id="modalCapital"></span></p>

        <p><b>Population:</b> <span id="modalPopulation"></span></p>

        <p><b>Region:</b> <span id="modalRegion"></span></p>

        <p><b>Subregion:</b> <span id="modalSubregion"></span></p>

        <p><b>Languages:</b> <span id="modalLanguages"></span></p>

        <button id="closeModal">Close</button>
      </div>
    </div>
    <script type="module" src="Flag-Task.js"></script>
  </body>
</html>
