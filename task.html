<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>=== Apex Task ===</title>
    <link rel="stylesheet" href="task.css" />
  </head>

  <body>
    <div class="container">
      <h1>Form Fill Exercise</h1>
      <h2>Time remaining: <span id="timer">60</span> seconds</h2>
      <form id="MyForm">
        <div class="form-group">
          <label for="firstName">firstName</label>
          <input type="text" id="firstName" placeholder="Enter First Name" />
          <small id="firstNameError" class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="lastName">lastName</label>
          <input type="text" id="lastName" placeholder="Enter last Name" />
          <small id="lastNameError" class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="Gender">Gender</label>
          <select id="selectedGender">
            <option value="" selected>Select a Gender</option>
            <option value="male">male</option>
            <option value="female">female</option>
          </select>
        </div>
        <button id="saveBtn" disabled>save</button>
      </form>
      <h2>Saved Users</h2>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Gender</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="userTable"></tbody>
      </table>
    </div>
    <script src="task.js"></script>
  </body>
</html>
