<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>=== Apex Task ===</title>
    <link rel="stylesheet" href="task.css" />
  </head>

  <body>
    <div class="container">
      <h1>Form Fill Exercise</h1>
      <h2>Time remaining: <span id="timer">60</span> seconds</h2>
      <form id="MyForm">
        <div class="form-group">
          <label for="firstName">firstName</label>
          <input type="text" id="firstName" placeholder="Enter First Name" />
          <small id="firstNameError" class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="lastName">lastName</label>
          <input type="text" id="lastName" placeholder="Enter last Name" />
          <small id="lastNameError" class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="Gender">Gender</label>
          <select id="selectedGender">
            <option value="" selected>Select a Gender</option>
            <option value="male">male</option>
            <option value="female">female</option>
          </select>
        </div>
        <small id="duplicateError" class="error-message"></small>
        <button id="saveBtn" disabled>save</button>
      </form>
      <h2>Search Users</h2>

      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Search by first name or last name..."
        />
      </div>
      <div class="gender-filter">
        <h3>Filter by Gender</h3>

        <div class="gender-buttons">
          <button id="allBtn" onclick="filterByGender('all')" class="active">
            All
          </button>

          <button id="maleBtn" onclick="filterByGender('male')">Male</button>

          <button id="femaleBtn" onclick="filterByGender('female')">
            Female
          </button>
        </div>
        <p id="genderStatus"></p>
      </div>
      <div class="flex" style="width: 100%">
        <h2>Saved Users</h2>
        <span id="countUser">Total Users: 0</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>
              <button class="sort-btn" onclick="sortUsers('id')">
                ID <span id="idArrow">↕</span>
              </button>
            </th>

            <th>
              <button class="sort-btn" onclick="sortUsers('firstName')">
                First Name <span id="firstNameArrow">↕</span>
              </button>
            </th>

            <th>
              <button class="sort-btn" onclick="sortUsers('lastName')">
                Last Name <span id="lastNameArrow">↕</span>
              </button>
            </th>
            <th>Gender</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="userTable"></tbody>
      </table>
      <button class="clear-all-btn" onclick="ClearAll()">Clear All</button>
    </div>

    <script src="task.js"></script>
  </body>
</html>
