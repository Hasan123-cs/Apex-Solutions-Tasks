<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-md-4">


                <div class="card shadow">

                    <div class="card-header text-center bg-primary text-white">
                        <h3>Login</h3>
                    </div>


                    <div class="card-body">


                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input id="username"
                                   class="form-control"
                                   placeholder="Enter username">

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input id="password"
                                   type="password"
                                   class="form-control"
                                   placeholder="Enter password">

                        </div>



                        <button id="loginBtn"
                                class="btn btn-primary w-100">

                            Login

                        </button>



                        <div class="mt-3 text-center">

                            <p id="message"
                               class="fw-bold">
                            </p>

                        </div>


                    </div>

                </div>


            </div>

        </div>

    </div>



    <script>

document
.getElementById("loginBtn")
.onclick = async()=>{


            let username =
            document
            .getElementById("username")
            .value;


            let password =
            document
            .getElementById("password")
            .value;



            let response =
            await fetch("/api/auth/login",
            {

                method:"POST",

                headers:
                {
                    "Content-Type":"application/json"
                },


                body:
                JSON.stringify(
                {
                    username,
                    password
                })

            });



            let data =
            await response.json();



            let message =
            document.getElementById("message");


            message.innerText =
            data.message;



            if(response.ok)
            {
                message.className =
                "text-success fw-bold";
            }
            else
            {
                message.className =
                "text-danger fw-bold";
            }


}


    </script>


</body>

</html>
